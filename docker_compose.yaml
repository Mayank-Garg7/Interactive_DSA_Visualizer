version: "3.9"

services:
  # Backend Service: FastAPI
  backend:
    build:
      context: ./visualizer_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./visualizer_backend:/app
      - /app/__pycache__
    environment:
      - ENV=development
    # Use --reload for development so code changes sync instantly
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Service: React (Vite)
  frontend:
    build:
      context: ./visualizer_frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./visualizer_frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    # Interactive mode is often needed for Vite in Docker
    stdin_open: true
    tty: true